# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = app/database/migrations

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local time
# timezone =

# max length of characters to include in representational
# name of parent revision.  If not specified, defaults to 40.
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded relative to the
# current working directory.
prepend_sys_path = .

# version path separator; as of Alembic 1.11.0, this defaults to os.pathsep
# version_locations = %(here)s/bar:%(here)s/bat

# version_path_separator = :

# logging configuration
# [loggers], [handlers], [qualnames], [formatters]
# are defined at the end of the file.

# the sqlalchemy.url will be overridden dynamically in env.py from settings
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/inventory_db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for details.

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
